name: Pages

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact accepted commit SHA to deploy
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, Linux]
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
      - name: Verify exact candidate
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be an exact 40-character lowercase hexadecimal commit SHA" >&2
            exit 1
          fi

          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "Expected $EXPECTED_SHA but checked out $actual_sha" >&2
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Require no high-severity audit findings
        run: npm audit --audit-level=high
      - name: Run contract tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Record deployed commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
        run: printf '%s\n' "$EXPECTED_SHA" > dist/DEPLOYED_COMMIT.txt
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: [self-hosted, Linux]
    needs: build
    steps:
      - name: Deploy exact candidate
        id: deployment
        uses: actions/deploy-pages@v4
