name: Apply pitch octave candidate

on:
  push:
    branches:
      - agent/pitch-arp-octave-relationship
    paths:
      - tools/apply_pitch_octave.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: agent/pitch-arp-octave-relationship
          fetch-depth: 0

      - name: Apply exact anchored patch
        run: python tools/apply_pitch_octave.py

      - name: Commit generated candidate
        run: |
          if git diff --quiet; then
            echo "Patch produced no changes" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scale-chance-ar-envelope.js tests/pitch-arp-octave-contract.test.mjs docs/manual-audio-test-checklist-v0.35-pitch-octave.md
          git commit -m "Add Pitch Arp octave relationship"
          git push origin HEAD:agent/pitch-arp-octave-relationship
