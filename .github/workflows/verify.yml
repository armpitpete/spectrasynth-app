name: Verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate patched PostCSS lockfile candidate
        run: npm update postcss --package-lock-only --ignore-scripts
      - name: Upload patched lockfile candidate
        uses: actions/upload-artifact@v4
        with:
          name: patched-package-lock
          path: package-lock.json
          retention-days: 1
      - name: Install candidate dependencies
        run: npm ci
      - name: Require no high-severity audit findings
        run: npm audit --audit-level=high
      - name: Run contract tests
        run: npm test
      - name: Build production bundle
        run: npm run build
