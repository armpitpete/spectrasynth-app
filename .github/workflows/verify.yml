name: Verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore unrelated lock metadata
        if: github.event_name == 'pull_request' && github.actor == 'armpitpete'
        shell: bash
        run: |
          git fetch origin main --depth=1
          git show origin/main:package-lock.json > package-lock.base.json
          node <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const base = JSON.parse(readFileSync("package-lock.base.json", "utf8"));
          const candidate = JSON.parse(readFileSync("package-lock.json", "utf8"));

          for (const key of ["node_modules/nanoid", "node_modules/postcss"]) {
            base.packages[key] = candidate.packages[key];
          }

          writeFileSync("package-lock.json", `${JSON.stringify(base, null, 2)}\n`);
          NODE
          rm package-lock.base.json

          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already minimal"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Limit lockfile update to patched PostCSS chain"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Install locked dependencies
        run: npm ci
      - name: Require no high-severity audit findings
        run: npm audit --audit-level=high
      - name: Run contract tests
        run: npm test
      - name: Build production bundle
        run: npm run build
