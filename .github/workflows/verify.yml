name: Verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Capture read-only dependency audit
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          audit_status=$?
          cat npm-audit.json
          printf 'npm audit exit code: %s\n' "$audit_status"
          exit 0
      - name: Run contract tests
        run: npm test
      - name: Build production bundle
        run: npm run build
